services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd-1
    command:
      - /usr/local/bin/etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=acr-etcd-cluster
    environment:
      ETCDCTL_API: "3"
    volumes:
      - etcd1_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd-2
    command:
      - /usr/local/bin/etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=acr-etcd-cluster
    environment:
      ETCDCTL_API: "3"
    volumes:
      - etcd2_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd-3
    command:
      - /usr/local/bin/etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=acr-etcd-cluster
    environment:
      ETCDCTL_API: "3"
    volumes:
      - etcd3_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  postgres-1:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: acr-postgres-patroni:15
    container_name: postgres-1
    environment:
      PATRONI_NAME: postgres-1
      PATRONI_SCOPE: acr-postgres
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-1:5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRES_REPLICATION_PASSWORD:?Set POSTGRES_REPLICATION_PASSWORD in .env}"
    volumes:
      - postgres1_data:/var/lib/postgresql/data
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "cyberresponse", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  postgres-2:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: acr-postgres-patroni:15
    container_name: postgres-2
    environment:
      PATRONI_NAME: postgres-2
      PATRONI_SCOPE: acr-postgres
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-2:5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRES_REPLICATION_PASSWORD:?Set POSTGRES_REPLICATION_PASSWORD in .env}"
    volumes:
      - postgres2_data:/var/lib/postgresql/data
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "cyberresponse", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  postgres-3:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: acr-postgres-patroni:15
    container_name: postgres-3
    environment:
      PATRONI_NAME: postgres-3
      PATRONI_SCOPE: acr-postgres
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-3:5432
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_REPLICATION_PASSWORD: "${POSTGRES_REPLICATION_PASSWORD:?Set POSTGRES_REPLICATION_PASSWORD in .env}"
    volumes:
      - postgres3_data:/var/lib/postgresql/data
    depends_on:
      etcd-1:
        condition: service_healthy
      etcd-2:
        condition: service_healthy
      etcd-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "cyberresponse", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: haproxy:3.0-alpine
    container_name: postgres
    ports:
      - "${FRAMEWORK_BIND_IP:-127.0.0.1}:5432:5432"
    volumes:
      - ./postgres/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      postgres-1:
        condition: service_healthy
      postgres-2:
        condition: service_healthy
      postgres-3:
        condition: service_healthy
    restart: unless-stopped

  postgres-init:
    image: postgres:15
    container_name: postgres-init
    environment:
      POSTGRES_USER: cyberresponse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres/init:/init:ro
      - ./postgres/init_cluster.sh:/usr/local/bin/init-cluster.sh:ro
    command: ["bash", "/usr/local/bin/init-cluster.sh"]
    depends_on:
      postgres:
        condition: service_started
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0

    container_name: otel-collector

    command: ["--config=/etc/otelcol-contrib/config.yaml"]

    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml

    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

    networks:
      - default
      - monitoring

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - otel-collector

    networks:
      - monitoring

    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3

    container_name: grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - monitoring

    restart: unless-stopped

  python:
    build:
      context: ./python
      dockerfile: Dockerfile

    image: cyber-response-app:local

    container_name: python-app

    depends_on:
      postgres-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      emqx-1:
        condition: service_healthy
      emqx-2:
        condition: service_healthy
      emqx-3:
        condition: service_healthy

    environment:
      HF_TOKEN: ${HF_TOKEN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AGENT_CREDENTIAL_FILE: /run/acr-agent-credentials/credential
      APPROVAL_TOKEN: ${APPROVAL_TOKEN:-}
      PYTHONPATH: /app:/app/RAG:/app/MAPE:/app/knowledge:/app/postgres:/app/MQTT
      MQTT_BROKERS: "emqx-1:1883,emqx-2:1883,emqx-3:1883"

    ports:
      - "${FRAMEWORK_BIND_IP:-127.0.0.1}:8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./.agent-credentials/framework:/run/acr-agent-credentials:ro
      - hf_cache:/root/.cache/huggingface
      - ./python:/app
      - ./RAG:/app/RAG
      - ./knowledge:/app/knowledge
      - ./postgres:/app/postgres
      - ./MAPE:/app/MAPE
      - ./MQTT:/app/MQTT

    working_dir: /app

    stdin_open: true
    tty: true

    command: python main.py

    networks:
      - default
      - emqx-net

    restart: unless-stopped

  outbox-publisher:
    build:
      context: ./python
      dockerfile: Dockerfile

    container_name: outbox-publisher

    image: cyber-response-app:local

    depends_on:
      postgres-init:
        condition: service_completed_successfully
      emqx-1:
        condition: service_healthy
      emqx-2:
        condition: service_healthy
      emqx-3:
        condition: service_healthy

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PYTHONPATH: /app:/app/postgres:/app/MQTT
      MQTT_BROKERS: "emqx-1:1883,emqx-2:1883,emqx-3:1883"

    volumes:
      - ./python:/app
      - ./postgres:/app/postgres
      - ./MQTT:/app/MQTT

    working_dir: /app

    command: ["python", "-m", "MQTT.outbox_publisher"]

    networks:
      - default
      - emqx-net

    restart: unless-stopped

  emqx-1:
    image: emqx:5.8.8

    container_name: emqx-1

    hostname: node1.emqx.local

    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"

    environment:
      EMQX_NODE__NAME: "emqx@node1.emqx.local"
      EMQX_NODE__COOKIE: "cyberresponse-emqx-cluster"

      EMQX_CLUSTER__DISCOVERY_STRATEGY: "static"
      EMQX_CLUSTER__STATIC__SEEDS: '["emqx@node1.emqx.local","emqx@node2.emqx.local","emqx@node3.emqx.local"]'

    volumes:
      - emqx1_data:/opt/emqx/data
      - emqx1_log:/opt/emqx/log

    networks:
      emqx-net:
        aliases:
          - node1.emqx.local

    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  emqx-2:
    image: emqx:5.8.8

    container_name: emqx-2

    hostname: node2.emqx.local

    ports:
      - "1884:1883"
      - "8085:8083"
      - "8086:8084"
      - "18084:18083"

    environment:
      EMQX_NODE__NAME: "emqx@node2.emqx.local"
      EMQX_NODE__COOKIE: "cyberresponse-emqx-cluster"

      EMQX_CLUSTER__DISCOVERY_STRATEGY: "static"
      EMQX_CLUSTER__STATIC__SEEDS: '["emqx@node1.emqx.local","emqx@node2.emqx.local","emqx@node3.emqx.local"]'

    volumes:
      - emqx2_data:/opt/emqx/data
      - emqx2_log:/opt/emqx/log

    networks:
      emqx-net:
        aliases:
          - node2.emqx.local

    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

  emqx-3:
    image: emqx:5.8.8

    container_name: emqx-3

    hostname: node3.emqx.local

    ports:
      - "1885:1883"
      - "8087:8083"
      - "8088:8084"
      - "18085:18083"

    environment:
      EMQX_NODE__NAME: "emqx@node3.emqx.local"
      EMQX_NODE__COOKIE: "cyberresponse-emqx-cluster"

      EMQX_CLUSTER__DISCOVERY_STRATEGY: "static"
      EMQX_CLUSTER__STATIC__SEEDS: '["emqx@node1.emqx.local","emqx@node2.emqx.local","emqx@node3.emqx.local"]'

    volumes:
      - emqx3_data:/opt/emqx/data
      - emqx3_log:/opt/emqx/log

    networks:
      emqx-net:
        aliases:
          - node3.emqx.local

    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  emqx-net:
    driver: bridge

volumes:
  ollama_data:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  postgres1_data:
  postgres2_data:
  postgres3_data:
  hf_cache:
  grafana_data:
  emqx1_data:
  emqx1_log:
  emqx2_data:
  emqx2_log:
  emqx3_data:
  emqx3_log:
