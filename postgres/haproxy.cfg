global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend postgres
    bind *:5432
    default_backend postgres_primary

backend postgres_primary
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    server postgres-1 postgres-1:5432 check port 8008 inter 2s fall 3 rise 2
    server postgres-2 postgres-2:5432 check port 8008 inter 2s fall 3 rise 2
    server postgres-3 postgres-3:5432 check port 8008 inter 2s fall 3 rise 2
